[package]
name = "sage"
version = "0.2.0"
edition = "2021"

[dependencies]
ropey = "1.6"
crossterm = "0.28"
arboard = "3.4"
unicode-width = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
zmq = "0.10"
uuid = { version = "1.0", features = ["v4"] }
glob = "0.3"
base64 = "0.22"
toml = "0.8"
dirs = "5.0"
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
keyring = "2"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1.1.9"
thiserror = "2.0.18"
http = "1.4.1"
url = "2.5.8"
mimalloc = "0.1.52"

# crossterm 0.28.1 with one fix, in vendor/crossterm/src/event/sys/windows/parse.rs
# (marked "sage patch"): on Windows it reported an Alt-code character (how the
# console types a pasted €, £, curly quote, em dash or no-break space) as a key
# release, so sage dropped it. Still unfixed upstream in 0.29.0 and on master
# (checked 2026-09-29); drop this and vendor/crossterm once a release fixes it.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[profile.release]
strip = true
lto = true
codegen-units = 1
